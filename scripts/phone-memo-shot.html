<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=390, initial-scale=1, viewport-fit=cover" />
  <title>Spoor phone memo shot</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400..700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --paper: #faf9f6;
      --ink: #1a1a1a;
      --muted: #5a5a54;
      --faint: #8c8a84;
      --line: #e6e4df;
      --accent: #c2410c;
      --cjk-ui: "Songti SC", "Source Han Serif SC", "Noto Serif SC", "STSong", "SimSun", serif;
      --cjk-note: var(--cjk-ui);
      --font-serif: "Newsreader", ui-serif, Georgia, Cambria, "Times New Roman", Times, var(--cjk-ui);
      --note-cjk-stack: "Newsreader", ui-serif, Georgia, Cambria, "Times New Roman", Times, var(--cjk-note), "Songti SC", serif;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 390px;
      max-width: 390px;
      height: 844px;
      background: var(--paper);
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
    }
    body {
      background-color: var(--paper);
      background-image: radial-gradient(rgba(28, 27, 27, 0.035) 0.6px, transparent 0.7px);
      background-size: 7px 7px;
    }
    .page {
      position: relative;
      width: 390px;
      height: 844px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      padding: calc(1.25rem + env(safe-area-inset-top, 0px)) 1.75rem calc(1.5rem + env(safe-area-inset-bottom, 0px));
    }
    .page--edit {
      padding-bottom: calc(1.75rem + env(safe-area-inset-bottom, 0px));
    }
    header {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 1.5rem;
      flex-shrink: 0;
    }
    header.edit {
      justify-content: flex-end;
      margin-bottom: 1.25rem;
    }
    h1 {
      margin: 0;
      font-family: var(--font-serif);
      font-size: 1.875rem;
      line-height: 2.25rem;
      font-weight: 400;
      color: var(--ink);
    }
    .account, .back {
      margin-left: auto;
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      border: 1px solid transparent;
      border-radius: 999px;
      background: transparent;
      flex-shrink: 0;
    }
    .back { margin-left: 0; }
    .list-scroll {
      flex: 1;
      min-height: 0;
      overflow: hidden;
      padding-bottom: 5.5rem;
    }
    ul {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }
    li {
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.8);
      border-radius: 0.75rem;
      padding: 0.875rem 1.125rem;
      width: 100%;
    }
    .row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 0.75rem;
    }
    .title {
      flex: 1;
      min-width: 0;
      font-family: var(--note-cjk-stack);
      font-size: 1.125rem;
      letter-spacing: 0.025em;
      line-height: 1.6;
      color: var(--ink);
      display: -webkit-box;
      -webkit-line-clamp: 1;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .time {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 12px;
      color: var(--faint);
      flex-shrink: 0;
      padding-top: 0.15rem;
    }
    .preview {
      margin: 0.375rem 0 0;
      font-family: var(--note-cjk-stack);
      font-size: 1.0625rem;
      color: var(--muted);
      letter-spacing: 0.02em;
      line-height: 1.7;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      white-space: pre-wrap;
    }
    .fab {
      position: absolute;
      right: 1.25rem;
      bottom: calc(1.25rem + env(safe-area-inset-bottom, 0px));
      width: 3.5rem;
      height: 3.5rem;
      border-radius: 999px;
      background: var(--accent);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 15px -3px rgba(194, 65, 12, 0.25), 0 4px 6px -4px rgba(194, 65, 12, 0.25);
      border: none;
      z-index: 2;
    }
    .editor {
      flex: 1;
      width: 100%;
      min-height: 0;
      border: none;
      outline: none;
      resize: none;
      background: transparent;
      padding: 0 0.25rem;
      font-family: var(--note-cjk-stack);
      font-size: 1.25rem;
      line-height: 1.8;
      letter-spacing: 0.025em;
      color: var(--ink);
      white-space: pre-wrap;
    }
    html[lang="zh"] .title,
    html[lang="zh"] .preview,
    html[lang="zh"] .editor {
      font-family: var(--cjk-note), "Newsreader", ui-serif, Georgia, serif;
    }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div id="list-view" class="page">
    <header>
      <h1 id="list-title">备忘</h1>
      <div class="account" aria-hidden>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75">
          <circle cx="12" cy="12" r="10" />
          <circle cx="12" cy="10" r="3" />
          <path d="M7 20.662A7 7 0 0 1 12 17a7 7 0 0 1 5 3.662" />
        </svg>
      </div>
    </header>
    <div class="list-scroll">
      <ul id="list"></ul>
    </div>
    <button id="fab" class="fab hidden" type="button" aria-hidden>
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M5 12h14M12 5v14" />
      </svg>
    </button>
  </div>

  <div id="edit-view" class="page page--edit hidden">
    <header class="edit">
      <div class="back" aria-hidden>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M19 12H5M12 19l-7-7 7-7" />
        </svg>
      </div>
    </header>
    <textarea id="editor" class="editor" readonly></textarea>
  </div>

  <script>
    const copy = {
      zh: {
        listTitle: '备忘',
        lang: 'zh',
        notes: [
          { title: '地铁上想到的结尾', preview: '她什么也不解释。只把那张旧票根放回抽屉。', time: '21:14' },
          { title: '把既视感那本书拖进画布', preview: '', time: '18:03' },
          { title: '晚上再问真知镜', preview: '我为什么会犹豫。不是怕失败。', time: '9月6日' },
        ],
        editorText: '地铁上想到的结尾\n\n她什么也不解释。只把那张旧票根放回抽屉。\n\n也许故事就该停在这里——在还能回头看一眼的时候。',
      },
      en: {
        listTitle: 'Memo',
        lang: 'en',
        notes: [
          { title: 'Ending that arrived on the train', preview: "She doesn't explain. She puts the old ticket back in the drawer.", time: '9:14 PM' },
          { title: 'Drop the déjà vu book onto the canvas', preview: '', time: '6:03 PM' },
          { title: 'Ask the Mirror tonight', preview: 'Why I hesitate. Not failing.', time: 'Sep 6' },
        ],
        editorText: "Ending that arrived on the train\n\nShe doesn't explain. She puts the old ticket back in the drawer.\n\nMaybe the story should stop here — while you can still look back.",
      },
    };

    const params = new URLSearchParams(location.search);
    const lang = params.get('lang') === 'en' ? 'en' : 'zh';
    const screen = params.get('screen') === 'edit' ? 'edit' : 'list';
    const data = copy[lang];

    document.documentElement.lang = data.lang;
    document.title = data.listTitle;

    function render() {
      if (screen === 'edit') {
        document.getElementById('list-view').classList.add('hidden');
        document.getElementById('edit-view').classList.remove('hidden');
        document.getElementById('editor').value = data.editorText;
        return;
      }

      document.getElementById('list-title').textContent = data.listTitle;
      const list = document.getElementById('list');
      for (const note of data.notes) {
        const li = document.createElement('li');
        const preview = note.preview ? `<p class="preview">${note.preview}</p>` : '';
        li.innerHTML = `<div class="row"><span class="title">${note.title}</span><span class="time">${note.time}</span></div>${preview}`;
        list.appendChild(li);
      }
      document.getElementById('fab').classList.remove('hidden');
    }

    document.fonts.ready.then(render).catch(render);
  </script>
</body>
</html>
